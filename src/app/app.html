<header class="app-header">
  <h1>{{ title() }}</h1>
  <nav>
    @if (user()) {
      <a routerLink="/spendings" routerLinkActive="active">Transakcje</a>
      <a routerLink="/card-authorizations" routerLinkActive="active">Autoryzacje kart</a>
      <a routerLink="/emails" routerLinkActive="active">E-maile mBank</a>
      <a routerLink="/dictionary/accounts" routerLinkActive="active">Słownik rachunków</a>
    }
  </nav>
  <div class="app-header__user">
    @if (user(); as u) {
      <span class="app-header__email" [title]="u.email ?? ''">{{ u.email }}</span>
      <button type="button" (click)="signOut()">Wyloguj</button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
